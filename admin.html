<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Messages | Hiten Patel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232638F0'/%3E%3Cg fill='%23fff'%3E%3Crect x='6' y='13' width='3' height='6' rx='1.5'/%3E%3Crect x='11' y='8' width='3' height='16' rx='1.5'/%3E%3Crect x='16' y='11' width='3' height='10' rx='1.5'/%3E%3Crect x='21' y='6' width='3' height='20' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Familjen+Grotesk:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
    <style>
        .admin { padding-block: 3rem 5rem; }
        .admin-head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .admin-head h1 { font-size: var(--step-3); }
        .admin-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 2rem; }
        .admin-note { color: var(--slate); font-size: var(--step--1); margin-bottom: 2rem; max-width: 62ch; }

        .message {
            padding: 1.25rem 0;
            border-top: 1px solid var(--line);
        }
        .message:last-child { border-bottom: 1px solid var(--line); }
        .message-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1rem; }
        .message-from { font-weight: 700; }
        .message-date { color: var(--slate); font-size: var(--step--1); }
        .message-subject { margin-top: 0.4rem; font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; }
        .message-body { margin-top: 0.4rem; max-width: 70ch; white-space: pre-wrap; }
        .message-email { margin-top: 0.5rem; }
        .message-email a { color: var(--ultra); }
        .empty { padding: 3rem 0; color: var(--slate); border-block: 1px solid var(--line); }

        .login {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem var(--gutter);
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            display: grid;
            gap: 1rem;
            padding: 2rem;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 12px;
        }
        .login-card h1 { font-size: var(--step-2); }
        .login-card .btn { justify-self: start; }
    </style>
</head>
<body>
    <div class="login" id="passwordModal">
        <form class="login-card" id="loginForm" novalidate>
            <h1>Sign in to messages</h1>
            <div class="field" id="pwField">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" autocomplete="current-password" required>
                <p class="field-error" id="pwError" hidden>That password isn't right. Try again.</p>
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
    </div>

    <main class="wrap admin" id="adminContent" hidden>
        <div class="admin-head">
            <h1>Messages</h1>
            <a href="index.html" class="btn">Back to the portfolio</a>
        </div>
        <p class="admin-note">These are copies saved in this browser when the contact form is sent from it. Every message also goes to your inbox through Formspree.</p>
        <div class="admin-actions">
            <button id="addTestMessage" class="btn btn-small" type="button">Add a test message</button>
            <button id="clearMessages" class="btn btn-small" type="button">Delete all messages</button>
        </div>
        <div id="messagesContainer"></div>
    </main>

    <script>
        const passwordModal = document.getElementById('passwordModal');
        const adminContent = document.getElementById('adminContent');
        const adminPassword = document.getElementById('adminPassword');
        const pwField = document.getElementById('pwField');
        const pwError = document.getElementById('pwError');

        // Simple client-side gate only: anyone can read this password in the page source.
        const correctPassword = 'admin123';

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (adminPassword.value === correctPassword) {
                passwordModal.hidden = true;
                passwordModal.style.display = 'none';
                adminContent.hidden = false;
                loadMessages();
            } else {
                pwField.classList.add('has-error');
                pwError.hidden = false;
                adminPassword.setAttribute('aria-invalid', 'true');
                adminPassword.setAttribute('aria-describedby', 'pwError');
                adminPassword.select();
            }
        });
        adminPassword.addEventListener('input', () => {
            pwField.classList.remove('has-error');
            pwError.hidden = true;
            adminPassword.removeAttribute('aria-invalid');
        });

        const readMessages = () => {
            try { return JSON.parse(localStorage.getItem('contactMessages')) || []; } catch (e) { return []; }
        };

        const el = (tag, cls, text) => {
            const n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text != null) n.textContent = text;
            return n;
        };

        function loadMessages() {
            const box = document.getElementById('messagesContainer');
            box.textContent = '';
            const messages = readMessages().sort((a, b) => new Date(b.date) - new Date(a.date));

            if (messages.length === 0) {
                box.appendChild(el('p', 'empty', 'No messages saved in this browser yet. New ones appear here after someone sends the contact form.'));
                return;
            }

            messages.forEach(m => {
                const card = el('article', 'message');
                const top = el('div', 'message-top');
                top.append(el('span', 'message-from', m.name), el('span', 'message-date', new Date(m.date).toLocaleString()));
                const email = el('p', 'message-email');
                const a = el('a', null, m.email);
                a.href = 'mailto:' + m.email;
                email.appendChild(a);
                card.append(top, el('p', 'message-subject', m.subject), el('p', 'message-body', m.message), email);
                box.appendChild(card);
            });
        }

        document.getElementById('clearMessages').addEventListener('click', () => {
            if (confirm('Delete all saved messages from this browser? This cannot be undone.')) {
                try { localStorage.removeItem('contactMessages'); } catch (e) {}
                loadMessages();
            }
        });

        document.getElementById('addTestMessage').addEventListener('click', () => {
            const messages = readMessages();
            messages.push({
                name: 'Test User',
                email: 'test@example.com',
                subject: 'Test message',
                message: 'This is a test message to show how the message list works.',
                date: new Date().toISOString()
            });
            try { localStorage.setItem('contactMessages', JSON.stringify(messages)); } catch (e) {}
            loadMessages();
        });
    </script>
</body>
</html>
